# This is the main CI pipeline for the project.
name: 🤖 CI Pipeline

# This workflow is triggered on pushes to master/main and on pull requests.
on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Sets default read-only permissions for the workflow.
permissions:
  contents: read
  security-events: write # Required for uploading SARIF to GitHub Security tab

jobs:
  # ============================================
  # Go Operator Build & Test
  # ============================================
  build-go:
    name: 🏗️ Build Go Operator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📂 Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 📥 Download dependencies
        run: go mod download

      - name: 🔍 Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2 # Keep in sync with GOLANGCI_LINT_VERSION in Makefile

      - name: 🛠️ Build
        run: make build

      - name: ✅ Run tests
        run: make test

      - name: 📊 Report coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: cover.out
          flags: go-unit-tests
          name: go-coverage
          fail_ci_if_error: false

      # Codacy upload is gated on same-repo PRs (and push events). On fork
      # pull_requests this step would receive ${{ secrets.CODACY_PROJECT_TOKEN }}
      # in the same job that just executed attacker-controlled `make test`
      # output — a textbook pwn-request pattern. Fork PRs will get coverage
      # uploaded by a follow-up workflow_run-style job in a future change.
      #
      # Dependabot PRs are also skipped: they run from same-repo branches, so
      # they pass the fork gate above, but GitHub withholds repository secrets
      # from the dependabot actor. The action then aborts on an empty token
      # ("Either a project or account API token must be provided") and fails
      # the job, which is why every open Dependabot PR sits BLOCKED on a red
      # required check that has nothing to do with its dependency change.
      - name: 📈 Report coverage to Codacy
        if: always() && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cover.out
          force-coverage-parser: go

      - name: 📦 Upload Go test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-artifacts
          path: |
            cover.out
          retention-days: 7

  # ============================================
  # Helm Chart Lint & Test
  # ============================================
  # Runs ct lint always; runs ct install (with kind cluster) on EVERY PR —
  # not just when charts/ changes. Issue #317 was a cmd/ change that broke the
  # default Helm install but no chart files moved, so the previous
  # "list-changed" gate let the regression through. Always installing closes
  # that hole. ct install picks up scenarios from charts/locust-k8s-operator/ci/
  # (default-values + webhook-enabled-values).
  lint-test-helm:
    name: 🌊 Lint & Test chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: 🌊 Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          check-latest: true

      - name: 📊 Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: 🔎 Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --config .github/ct.yaml

      - name: ⛵ Create kind cluster
        uses: helm/kind-action@v1.14.0

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 🛠️ Install ko
        uses: ko-build/setup-ko@v0.9

      - name: 🐳 Build operator image with ko
        env:
          KO_DOCKER_REPO: lotest/locust-k8s-operator
        run: |
          CHART_VERSION=$(grep '^appVersion:' charts/locust-k8s-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          ko build ./cmd --local --bare --tags=${CHART_VERSION}

      - name: 📦 Load image into kind cluster
        run: |
          CHART_VERSION=$(grep '^appVersion:' charts/locust-k8s-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          kind load docker-image lotest/locust-k8s-operator:${CHART_VERSION} --name chart-testing

      # cert-manager is required for ci/webhook-enabled-values.yaml. Use
      # the official Jetstack Helm repo rather than a raw kubectl apply of
      # a release-asset URL — Helm's install path is cacheable, idempotent,
      # and surfaces signature failures more clearly than `kubectl apply -f`
      # does.
      - name: 🔐 Install cert-manager (for webhook-enabled scenario)
        run: |
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.21.1 \
            --set crds.enabled=true \
            --wait --timeout=3m
          kubectl -n cert-manager rollout status deploy/cert-manager --timeout=120s
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=120s
          kubectl -n cert-manager rollout status deploy/cert-manager-cainjector --timeout=120s

      - name: 🚀 Run chart-testing (install)
        # --all forces ct to install regardless of git-changed scope; pairs
        # with removing the list-changed gate so this runs on every PR.
        run: |
          ct install --all --target-branch ${{ github.event.repository.default_branch }} \
            --config .github/ct.yaml \
            --helm-extra-set-args "--set=image.pullPolicy=Never"

      - name: 📦 Collect kind cluster logs on failure
        if: failure()
        run: kind export logs kind-logs --name chart-testing

      - name: 📦 Upload Helm test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: helm-test-artifacts
          path: |
            kind-logs/
          retention-days: 7

  docs-test:
    name: 📚 Test documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: 🐍 Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: 📦 Install dependencies
        run: |
          pip install \
          mkdocs-material \
          mkdocs-git-revision-date-localized-plugin \
          mkdocs-minify-plugin

      - name: 📄 Build documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m mkdocs build

      - name: 📦 Upload docs build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-build-artifacts
          path: |
            site/
          retention-days: 7

  # ============================================
  # Security Scanning with Trivy
  # ============================================
  security-scan:
    name: 🔒 Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: 🔧 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 🛠️ Install ko
        uses: ko-build/setup-ko@v0.9

      - name: 🐳 Build operator image with ko
        env:
          KO_DOCKER_REPO: lotest/locust-k8s-operator
        run: |
          CHART_VERSION=$(grep '^appVersion:' charts/locust-k8s-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          ko build ./cmd --local --bare --tags=${CHART_VERSION}
          echo "IMAGE_TAG=${CHART_VERSION}" >> $GITHUB_ENV

      # `severity` alone does NOT gate this job. When `format: sarif`,
      # trivy-action's entrypoint unsets TRIVY_SEVERITY unless
      # `limit-severities-for-sarif` is true — it logs "Building SARIF report
      # with all severities" and scans UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL. Paired
      # with `exit-code: 1` that failed the build on any LOW/MEDIUM finding,
      # contradicting the CRITICAL/HIGH policy documented in SECURITY.md.
      # `limit-severities-for-sarif: true` makes the declared severity the real
      # gate. It must be exactly lowercase `true`: upstream's
      # `${INPUT_LIMIT_SEVERITIES_FOR_SARIF:-false,,}` is a no-op lowercasing
      # attempt, so `True`/`yes`/`1` silently fall back to all severities.
      # Tradeoff: the uploaded SARIF then carries only CRITICAL/HIGH, so
      # LOW/MEDIUM findings no longer appear in the Security tab from this
      # scan. The daily scheduled scan still reports the full range, but only
      # for the released `:latest` image — LOW/MEDIUM introduced by a merged
      # but unreleased change stay invisible until the next release.
      - name: 🔍 Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lotest/locust-k8s-operator:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: 1 # Fail the build if CRITICAL/HIGH vulnerabilities are found

      - name: 📊 Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

      - name: 📦 Upload Trivy scan artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 7
