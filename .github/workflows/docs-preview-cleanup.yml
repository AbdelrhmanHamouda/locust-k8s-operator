# Remove the documentation preview when a pull request is closed or merged.
# Runs under pull_request_target so it can push to gh-pages for fork PRs too.
# SECURITY: this workflow must never check out or execute code from the PR head.
# It only checks out the trusted gh-pages branch.
name: 🧹 Docs Preview Cleanup

on:
  pull_request_target:
    types: [closed]
    branches:
      - master
      - main

jobs:
  # Clean up preview when PR is closed/merged
  cleanup-preview:
    permissions:
      contents: write       # Push to gh-pages branch
      pull-requests: write  # Update comment on cleanup
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Remove preview directory
        run: |
          if [ -d "pr-${{ github.event.number }}" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            rm -rf "pr-${{ github.event.number }}"
            git add .
            git commit -m "Clean up docs preview for PR #${{ github.event.number }}" || echo "Nothing to clean up"
            git push || echo "Nothing to push"
          else
            echo "Preview directory pr-${{ github.event.number }} not found, nothing to clean up"
          fi

      - name: 💬 Update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Find existing preview comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📚 Documentation Preview')
            );

            if (botComment) {
              const updatedBody = botComment.body.replace(
                /🔗 \*\*Preview URL:\*\* .*/,
                '🔗 **Preview URL:** ~~Preview cleaned up after PR closure~~'
              );

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: updatedBody + '\n\n✅ **Preview cleaned up** - This PR has been closed/merged.'
              });
            }
