apiVersion: v2
name: locust-k8s-operator
description: Production-ready Kubernetes operator for distributed Locust load testing with native OpenTelemetry, HA support, and automatic v1→v2 migration
icon: https://raw.githubusercontent.com/AbdelrhmanHamouda/locust-k8s-operator/master/docs/assets/images/favicon.png

# Keywords for Artifact Hub search discoverability
keywords:
  - locust
  - load-testing
  - performance-testing
  - kubernetes-operator
  - distributed-testing
  - opentelemetry
  - observability
  - stress-testing

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 2.4.4

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "2.4.1"

kubeVersion: ">= 1.29.0-0"
home: https://github.com/AbdelrhmanHamouda/locust-k8s-operator
sources:
  - https://github.com/AbdelrhmanHamouda/locust-k8s-operator
maintainers:
  - name: Abdelrhman Hamouda
    url: https://github.com/AbdelrhmanHamouda

annotations:
  # Artifact Hub specific metadata
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/links: |
    - name: Documentation
      url: https://abdelrhmanhamouda.github.io/locust-k8s-operator/
    - name: Getting Started
      url: https://abdelrhmanhamouda.github.io/locust-k8s-operator/getting_started/
    - name: Migration Guide (v1→v2)
      url: https://abdelrhmanhamouda.github.io/locust-k8s-operator/migration/
    - name: GitHub Discussions
      url: https://github.com/AbdelrhmanHamouda/locust-k8s-operator/discussions
    - name: GitHub Issues
      url: https://github.com/AbdelrhmanHamouda/locust-k8s-operator/issues
  artifacthub.io/changes: |
    - kind: security
      description: Operator image now builds on Go 1.26.7, picking up the crypto/tls, net/http, html/template, encoding/asn1, and net/url standard library fixes
    - kind: changed
      description: Default metrics exporter image bumped to containersol/locust_exporter:v0.5.2
    - kind: changed
      description: Default OpenTelemetry collector image bumped to otel/opentelemetry-collector-contrib:0.159.0
    - kind: fixed
      description: Chart README now documents the correct replicaCount name and default, memory limit, cert-manager default, and standalone OpenTelemetry collector
    - kind: fixed
      description: Documentation corrected across the Helm deploy, API reference, FAQ, architecture, and kind validation guides, including broken links and stale version requirements
    - kind: removed
      description: Dead code from the original scaffolding and the Java-era port, including the internal/testdata package, unused constants, and orphaned e2e test helpers
