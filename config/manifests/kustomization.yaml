# These resources constitute the fully configured set of manifests
# used to generate the 'manifests/' directory in a bundle (`make bundle`).
#
# ../olm (not ../default) is the source: it turns the admission and conversion
# webhooks on and leaves cert-manager out, because OLM issues and injects the
# webhook certificates itself. See config/olm/kustomization.yaml.
resources:
- bases/locust-k8s-operator.clusterserviceversion.yaml
- ../olm
- ../samples
- ../scorecard

# The CSV's containerImage annotation follows the operator Deployment's image,
# which `make bundle` sets in config/olm from BUNDLE_OPERATOR_IMG.
replacements:
- source:
    kind: Deployment
    name: controller-manager
    fieldPath: spec.template.spec.containers.[name=manager].image
  targets:
  - select:
      kind: ClusterServiceVersion
    fieldPaths:
    - metadata.annotations.containerImage
    options:
      create: true
