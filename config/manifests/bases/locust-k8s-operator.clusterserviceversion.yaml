apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Developer Tools
    description: Run distributed Locust load tests on Kubernetes, declared as a LocustTest
      custom resource.
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    operatorframework.io/suggested-namespace: locust-system
    repository: https://github.com/AbdelrhmanHamouda/locust-k8s-operator
    support: Community
  name: locust-k8s-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: LocustTest is the Schema for the locusttests API.
      displayName: Locust Test
      kind: LocustTest
      name: locusttests.locust.io
      resources:
      - kind: Job
        name: ""
        version: v1
      - kind: Pod
        name: ""
        version: v1
      - kind: Service
        name: ""
        version: v1
      specDescriptors:
      - description: Env configuration for environment variable injection.
        displayName: Environment
        path: env
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: Image is the container image for Locust pods.
        displayName: Locust Image
        path: image
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - description: ImagePullPolicy for the Locust container.
        displayName: Image Pull Policy
        path: imagePullPolicy
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:imagePullPolicy
      - description: ImagePullSecrets for pulling from private registries.
        displayName: Image Pull Secrets
        path: imagePullSecrets
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: Master configuration for the master node.
        displayName: Master
        path: master
      - description: Observability configuration for metrics and tracing.
        displayName: Observability
        path: observability
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: Scheduling configuration for pod placement.
        displayName: Scheduling
        path: scheduling
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: Security configuration for pod and container security contexts.
        displayName: Security
        path: security
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: TestFiles configuration for locustfile and library mounting.
        displayName: Test Files
        path: testFiles
      - description: VolumeMounts for the locust container with target selection.
        displayName: Volume Mounts
        path: volumeMounts
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: Volumes to add to pods.
        displayName: Volumes
        path: volumes
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:advanced
      - description: Worker configuration for worker nodes.
        displayName: Worker
        path: worker
      - description: Replicas is the number of worker pods to create.
        displayName: Worker Replicas
        path: worker.replicas
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:podCount
      statusDescriptors:
      - description: CompletionTime is when the test completed.
        displayName: Completion Time
        path: completionTime
        x-descriptors:
        - urn:alm:descriptor:timestamp
      - description: Conditions represent the latest available observations of the
          test's state.
        displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      - description: |-
          ConnectedWorkers is the approximate number of connected workers,
          derived from the worker Job's Active pod count (Job.Status.Active).
          This is an approximation as Kubernetes Job.Status.Active may lag behind
          actual Locust worker connections.
        displayName: Connected Workers
        path: connectedWorkers
        x-descriptors:
        - urn:alm:descriptor:text
      - description: ExpectedWorkers is the number of workers expected to connect.
        displayName: Expected Workers
        path: expectedWorkers
        x-descriptors:
        - urn:alm:descriptor:text
      - description: Phase is the current lifecycle phase of the test.
        displayName: Phase
        path: phase
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.phase
      - description: StartTime is when the test started.
        displayName: Start Time
        path: startTime
        x-descriptors:
        - urn:alm:descriptor:timestamp
      version: v2
    - description: LocustTest is the Schema for the locusttests API (v1 - DEPRECATED).
      displayName: Locust Test (v1, deprecated)
      kind: LocustTest
      name: locusttests.locust.io
      version: v1
  description: |
    The Locust Kubernetes Operator runs distributed [Locust](https://locust.io) load tests on Kubernetes.
    You describe a test as a `LocustTest` custom resource; the operator creates the Locust master and worker
    pods, wires the workers to the master, reports progress in the resource's status, and cleans up when the
    run finishes. Full documentation lives at https://abdelrhmanhamouda.github.io/locust-k8s-operator/.

    ### Features

    * **One resource per test.** Image, master and worker commands, worker count and resources all sit in a
      single `LocustTest`. Tests run isolated from each other, so many can run at once.
    * **CI friendly.** `autostart` and `autoquit` let a test start as soon as workers connect and exit when
      it's done, and an optional Job TTL removes finished runs.
    * **Observability.** Native OpenTelemetry export of Locust traces and metrics, or a Prometheus exporter
      sidecar for setups that aren't on OTLP yet.
    * **Placement control.** Node affinity, tolerations, node selectors and `runtimeClassName` for sandboxed
      runtimes, with separate resource specs for master and workers.
    * **Runtime inputs.** Inject Secrets and ConfigMaps as environment variables or file mounts, mount any
      volume type on the master, the workers or both, and pull from private registries.
    * **OpenShift friendly.** Neither the operator nor the pods it creates pin a UID, so the SCC can assign
      one, and the `security` field sets pod and container security contexts to match your SCC.
    * **API migration.** The deprecated `locust.io/v1` API keeps working through a conversion webhook while
      you move to `locust.io/v2`.

    ### Usage

    1. Put your locustfile in a ConfigMap in the namespace where the test will run:

       ```
       kubectl create configmap locust-scripts --from-file=locustfile.py
       ```

    2. Create a `LocustTest` that points at it (the example in this listing does exactly that), then follow
       it with `kubectl get locusttest -w`.

    See the [getting started guide](https://abdelrhmanhamouda.github.io/locust-k8s-operator/getting_started/)
    and the [API reference](https://abdelrhmanhamouda.github.io/locust-k8s-operator/api_reference/) for every field.

    ### Prerequisites

    * Kubernetes 1.29 or newer (OpenShift 4.16 or newer). The metrics exporter runs as a native sidecar.
    * The operator watches every namespace, so it installs in AllNamespaces mode only. OLM issues and rotates
      the webhook certificates; cert-manager isn't needed.
    * The operator settings from the Helm chart's `locustPods` section are environment variables on the
      operator Deployment. Override them through the Subscription's `spec.config.env`, for example
      `POD_CPU_LIMIT` or `JOB_TTL_SECONDS_AFTER_FINISHED`.
  displayName: Locust Kubernetes Operator
  icon:
  - base64data: 
    mediatype: image/png
  install:
    spec:
      deployments: null
    strategy: ""
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - locust
  - load testing
  - performance testing
  - stress testing
  - distributed testing
  - opentelemetry
