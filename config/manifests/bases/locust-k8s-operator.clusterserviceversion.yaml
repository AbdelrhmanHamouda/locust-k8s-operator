  - name: Source Code
    url: https://github.com/AbdelrhmanHamouda/locust-k8s-operator
  - name: Helm Chart
    url: https://artifacthub.io/packages/helm/locust-k8s-operator/locust-k8s-operator
  - name: Locust
    url: https://locust.io
  maintainers:
  - email: abdelrhman.ahmed@outlook.com
    name: Abdelrhman Hamouda
  maturity: stable
  minKubeVersion: 1.29.0
