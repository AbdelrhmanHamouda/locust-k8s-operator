apiVersion: locust.io/v2
kind: LocustTest
metadata:
  name: e2e-test-invalid-runtimeclass
spec:
  master:
    command: "-f /lotest/src/locustfile.py"
  worker:
    replicas: 1
    command: "-f /lotest/src/locustfile.py"
  image: locustio/locust:latest
  testFiles:
    configMapRef: e2e-test-configmap
  scheduling:
    # Not a DNS-1123 subdomain: the CRD schema must reject this at admission.
    runtimeClassName: gVisor_Sandbox
